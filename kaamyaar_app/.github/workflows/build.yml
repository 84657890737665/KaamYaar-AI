name: Build Flutter APK
on:
  push:
    branches: [ feature/flutter-app ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'
      
      - name: Get dependencies
        run: flutter pub get
        working-directory: kaamyaar_app
      
      - name: Build APK
        run: flutter build apk --release
        working-directory: kaamyaar_app
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaamyaar-ai-apk
          path: kaamyaar_app/build/app/outputs/flutter-apk/app-release.apk